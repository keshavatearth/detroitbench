<div id="detroit-hostage-flow">
  <style>
    #detroit-hostage-flow { color: var(--foreground); width: 100%; }
    #detroit-hostage-flow .flow-heading { margin-bottom: 12px; }
    #detroit-hostage-flow .flow-legend { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 12px 0 20px; }
    #detroit-hostage-flow .legend-item { display: inline-flex; align-items: center; gap: 7px; }
    #detroit-hostage-flow .swatch { width: 25px; height: 3px; display: inline-block; background: var(--viz-series-1); }
    #detroit-hostage-flow .swatch-b { background: var(--viz-series-2); }
    #detroit-hostage-flow .swatch-unused { height: 1px; background: var(--border); }
    #detroit-hostage-flow .chapter-part { margin: 12px 0 24px; }
    #detroit-hostage-flow .part-title { cursor: pointer; font-weight: 500; padding: 10px 0; }
    #detroit-hostage-flow .part-subtitle { margin: 0 0 12px; }
    #detroit-hostage-flow .flow-plot { position: relative; width: 100%; }
    #detroit-hostage-flow .flow-svg { display: block; width: 100%; overflow: visible; }
    #detroit-hostage-flow .flow-svg text { fill: var(--foreground); font-size: 12px; }
    #detroit-hostage-flow .flow-svg .node-label { font-weight: 500; }
    #detroit-hostage-flow .flow-svg .node-hint { fill: var(--muted-foreground); }
    #detroit-hostage-flow .flow-svg .flow-node { cursor: pointer; }
    #detroit-hostage-flow .flow-svg .flow-node:focus .node-shape { stroke: var(--ring); stroke-width: 2; }
    #detroit-hostage-flow .flow-svg .flow-node:hover .node-shape { stroke: var(--foreground); }
    #detroit-hostage-flow .flow-detail { position: absolute; left: 20px; right: 20px; background: var(--background); padding: 0 4px 16px; }
    #detroit-hostage-flow .detail-top { display: flex; gap: 12px; flex-wrap: wrap; justify-content: space-between; align-items: center; }
    #detroit-hostage-flow .detail-models { overflow-wrap: anywhere; margin: 8px 0; }
    #detroit-hostage-flow .flow-detail pre { white-space: pre-wrap; overflow-wrap: anywhere; margin: 8px 0; }
    #detroit-hostage-flow .flow-detail details { margin-top: 12px; }
    #detroit-hostage-flow .flow-detail summary { cursor: pointer; }
    #detroit-hostage-flow .command-cell { overflow-wrap: anywhere; }
    #detroit-hostage-flow .model-cell { min-width: 64px; overflow-wrap: anywhere; }
    #detroit-hostage-flow .flow-foot { margin: 20px 0 0; }
  </style>
  <div class="flow-heading">
    <h2>The Hostage · choice flow</h2>
    <div class="text-small text-muted" data-role="provenance"></div>
  </div>
  <div class="viz-controls">
    <label class="form-label">Model A<select class="form-select" data-role="model-a" aria-label="Model A"></select></label>
    <label class="form-label">Model B<select class="form-select" data-role="model-b" aria-label="Model B"></select></label>
  </div>
  <div class="flow-legend text-small">
    <span class="legend-item"><span class="swatch" aria-hidden="true"></span><span data-role="label-a">A</span></span>
    <span class="legend-item"><span class="swatch swatch-b" aria-hidden="true"></span><span data-role="label-b">B</span></span>
    <span class="legend-item"><span class="swatch swatch-unused" aria-hidden="true"></span>Other branches</span>
    <span>Counts = distinct models · A/B # = command order</span>
  </div>
  <div data-role="parts"></div>
  <div class="text-small text-muted flow-foot">Current CLI implementation · unused conditional branches included · select a choice for commands and model names</div>
  <div class="sr-only" aria-live="polite" data-role="announcement"></div>
  <script type="application/json" data-role="flow-data"><!-- FLOW_DATA --></script>
  <script>
    (() => {
      const root = document.getElementById('detroit-hostage-flow');
      const data = JSON.parse(root.querySelector('[data-role="flow-data"]').textContent);
      const $ = role => root.querySelector('[data-role="' + role + '"]');
      const nodes = data.nodes, models = data.models;
      const NS = 'http://www.w3.org/2000/svg';
      const colorA = 'var(--viz-series-1)', colorB = 'var(--viz-series-2)';
      let selected = null, selectedSection = null, scheduled = false;
      const plots = new Map();
      const shortName = id => id.replace('gpt-', 'GPT ').replace('claude-', 'Claude ').replace('-20251001', '').replace('-preview', '').replace('-0731', '').replace('gemini-', 'Gemini ').replace('deepseek-', 'DeepSeek ').replace('nemotron-', 'Nemotron ').replace('minimax-', 'MiniMax ').replace('grok-', 'Grok ').replace('glm-', 'GLM ').replace('kimi-', 'Kimi ');
      const modelName = mi => shortName(models[mi].id);
      const formatTime = ms => { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
      const members = n => Object.keys(n.matches).map(Number);
      const has = (node, model) => model !== '' && Object.hasOwn(node.matches, model);
      const aVal = () => $('model-a').value, bVal = () => $('model-b').value;
      const svgEl = (name, attrs = {}) => {
        const element = document.createElementNS(NS, name);
        for (const [key, value] of Object.entries(attrs)) element.setAttribute(key, value);
        return element;
      };
      const htmlEl = (name, className, text) => {
        const element = document.createElement(name);
        if (className) element.className = className;
        if (text !== undefined) element.textContent = text;
        return element;
      };
      $('provenance').textContent = models.length + ' models · ' + data.accepted + ' accepted commands · build ' + data.revision.slice(0, 7);
      for (const role of ['model-a', 'model-b']) {
        const select = $(role);
        const none = document.createElement('option'); none.value = ''; none.textContent = 'No highlight'; select.append(none);
        models.forEach((model, index) => {
          const option = document.createElement('option');
          option.value = String(index); option.textContent = shortName(model.id) + ' · ' + model.effort;
          select.append(option);
        });
        select.value = String(models.findIndex(m => m.id === (role === 'model-a' ? 'gpt-5.6-luna' : 'gpt-5.6-sol')));
        select.addEventListener('change', () => { refreshLegend(); if (selected) populateDetail(); schedule(); });
      }
      function refreshLegend() {
        $('label-a').textContent = aVal() === '' ? 'A · none' : 'A · ' + modelName(+aVal());
        $('label-b').textContent = bVal() === '' ? 'B · none' : 'B · ' + modelName(+bVal());
      }
      function wrap(text, width) {
        const limit = Math.max(9, Math.floor(width / 6.5));
        const words = text.split(/\s+/), lines = [];
        let line = '';
        for (const word of words) {
          if (line && line.length + word.length + 1 > limit) { lines.push(line); line = word; }
          else line += (line ? ' ' : '') + word;
        }
        if (line) lines.push(line);
        // Labels are never truncated: the node height grows with the line count.
        return lines;
      }
      function marks(node) {
        const labels = [];
        for (const [letter, mi] of [['A', aVal()], ['B', bVal()]]) {
          if (!has(node, mi)) continue;
          const events = node.matches[mi].map(ei => models[+mi].events[ei]);
          const numbers = [...new Set(events.map(e => e.n).filter(n => n != null))];
          if (node.action === 'move-closer') {
            const steps = events.reduce((sum, event) => sum + event.actions.filter(a => a.id === 'move-closer').reduce((sum, a) => sum + a.value, 0), 0);
            labels.push(letter + ' ' + steps + ' steps');
          } else if (node.kind === 'gate' || !numbers.length) labels.push(letter);
          else if (numbers.length <= 2) labels.push(letter + ' #' + numbers.join(', '));
          else labels.push(letter + ' ×' + numbers.length);
        }
        return labels.join(' · ');
      }
      function makeTable(events) {
        const container = htmlEl('div', 'table-responsive');
        const table = htmlEl('table', 'table table-sm');
        const thead = document.createElement('thead'), tr = document.createElement('tr');
        for (const text of ['Model', 'Command', 'Time', 'P', 'Steps away']) tr.append(htmlEl('th', '', text));
        thead.append(tr); table.append(thead);
        const tbody = document.createElement('tbody');
        for (const entry of events) {
          const e = entry.event, tr = document.createElement('tr');
          tr.append(htmlEl('td', 'model-cell', entry.label));
          tr.append(htmlEl('td', 'command-cell', (e.n ? '#' + e.n + ' · ' : 'Rejected · ') + 'detroit choose ' + e.command));
          tr.append(htmlEl('td', 'tabular-nums', formatTime(e.ms)));
          tr.append(htmlEl('td', 'tabular-nums', e.prob + '%'));
          tr.append(htmlEl('td', 'tabular-nums', e.distance));
          tbody.append(tr);
        }
        table.append(tbody); container.append(table); return container;
      }
      function populateDetail() {
        if (!selected) return;
        const plot = plots.get(selectedSection), box = plot.detail;
        const node = nodes[selected];
        box.replaceChildren();
        box.append(document.createElement('hr'));
        const head = htmlEl('div', 'detail-top');
        const count = members(node).length;
        head.append(htmlEl('span', '', node.label + ' · ' + count + ' of ' + models.length + ' models'));
        const close = htmlEl('button', 'btn btn-ghost', 'Close'); close.type = 'button';
        close.addEventListener('click', () => { selected = null; selectedSection = null; box.hidden = true; schedule(); });
        head.append(close); box.append(head);
        if (node.hint) box.append(htmlEl('div', 'text-small text-muted', node.hint));
        if (node.action && node.offered.length) {
          box.append(htmlEl('div', 'text-small', 'Offered to ' + node.offered.length + ' models · selected by ' + count));
        }
        if (node.special === 'incomplete') box.append(htmlEl('div', 'detail-models', 'MiniMax M3 returned a command as chat text in all four activations. No accepted or rejected CLI submission.'));
        const chosenNames = members(node).map(modelName).join(' · ');
        box.append(htmlEl('div', 'detail-models text-small', chosenNames || 'No recorded model took this branch.'));
        const events = [];
        for (const [letter, mi] of [['A', aVal()], ['B', bVal()]]) {
          if (mi === '') continue;
          const hits = node.matches[mi] || [];
          if (!hits.length) {
            const text = has(node, mi) ? 'reached' : node.offered.includes(+mi) ? 'not selected' : 'not reached / not offered';
            box.append(htmlEl('div', 'text-small', letter + ' · ' + modelName(+mi) + ' — ' + text));
          }
          for (const ei of hits) events.push({ label: letter + ' · ' + modelName(+mi), event: models[+mi].events[ei] });
        }
        if (events.length) box.append(makeTable(events));
        const all = htmlEl('details');
        all.append(htmlEl('summary', '', 'All models · choices and commands'));
        const allEvents = [];
        for (const mi of members(node)) for (const ei of node.matches[String(mi)]) allEvents.push({ label: modelName(mi), event: models[mi].events[ei] });
        if (allEvents.length) all.append(makeTable(allEvents));
        const others = models.map((m, mi) => !has(node, String(mi)) ? modelName(mi) : null).filter(Boolean);
        if (others.length) all.append(htmlEl('div', 'text-small detail-models', 'Did not take this branch: ' + others.join(' · ')));
        box.append(all);
        const invalids = [];
        for (let mi = 0; mi < models.length; mi++) for (const event of models[mi].events) {
          if (event.type === 'invalid_choice' && node.contexts.includes(event.old)) invalids.push({label: modelName(mi), event});
        }
        if (invalids.length && node.kind === 'gate') {
          const rejected = htmlEl('details');
          rejected.append(htmlEl('summary', '', invalids.length + ' rejected submissions around this scene'));
          rejected.append(makeTable(invalids)); box.append(rejected);
        }
        if (events.length) {
          const transcript = htmlEl('details');
          transcript.append(htmlEl('summary', '', 'Recorded scene text'));
          for (const entry of events) {
            transcript.append(htmlEl('div', 'text-small', entry.label + ' · #' + entry.event.n));
            transcript.append(htmlEl('pre', 'text-small', entry.event.text));
          }
          box.append(transcript);
        }
        box.hidden = false;
      }
      function selectNode(key, sectionId) {
        for (const p of plots.values()) p.detail.hidden = true;
        selected = key; selectedSection = sectionId;
        populateDetail();
        $('announcement').textContent = nodes[key].label + ', ' + members(nodes[key]).length + ' models. Details expanded below the selected row.';
        schedule();
      }
      function schedule() {
        if (scheduled) return;
        scheduled = true;
        requestAnimationFrame(() => { scheduled = false; for (const plot of plots.values()) if (plot.disclosure.open) draw(plot); });
      }
      function draw(plot) {
        const width = Math.floor(plot.wrap.getBoundingClientRect().width);
        if (width < 100) return;
        const columns = width >= 650 ? 4 : width >= 460 ? 3 : 2;
        const gap = 16, margin = 22, rowGap = 36;
        const physicalRows = [];
        for (const row of plot.section.rows) {
          for (let i = 0; i < row.length; i += columns) physicalRows.push(row.slice(i, i + columns));
        }
        const loc = new Map();
        let y = 18, detailStart = null, detailEnd = null;
        const activeHere = selected && selectedSection === plot.section.id;
        const detailHeight = activeHere ? Math.ceil(plot.detail.getBoundingClientRect().height) + 20 : 0;
        physicalRows.forEach((row, rank) => {
          const w = Math.min(258, (width - 2 * margin - gap * (row.length - 1)) / row.length);
          const start = (width - (w * row.length + gap * (row.length - 1))) / 2;
          const prepared = row.map((id, i) => {
            const node = nodes[id];
            const label = wrap(node.label, w - 20);
            const hint = node.hint ? wrap(node.hint, w - 20) : [];
            const mark = marks(node), markLines = mark ? wrap(mark, w - 20) : [];
            const h = 20 + label.length * 16 + hint.length * 15 + 20 + (markLines.length ? 4 + markLines.length * 15 : 0);
            return {id, rank, x: start + i * (w + gap), y, w, h, label, hint, markLines};
          });
          const rowHeight = Math.max(...prepared.map(p => p.h));
          prepared.forEach(p => { p.h = rowHeight; loc.set(p.id, p); });
          y += rowHeight;
          if (activeHere && row.includes(selected)) {
            detailStart = y + 12;
            plot.detail.style.top = detailStart + 'px';
            y += detailHeight + 24;
            detailEnd = y;
          }
          y += rowGap;
        });
        const svg = svgEl('svg', {viewBox: '0 0 ' + width + ' ' + y, width, height: y, class: 'flow-svg', role: 'group', 'aria-label': plot.section.title + ' interactive flowchart'});
        const title = svgEl('title'); title.textContent = plot.section.title; svg.append(title);
        const desc = svgEl('desc'); desc.textContent = plot.section.subtitle + '. Nodes show total models and the highlighted models’ command order. Activate a node to inspect its recorded choices.'; svg.append(desc);
        const defs = svgEl('defs');
        const marker = svgEl('marker', {id: 'arrow-' + plot.section.id, viewBox: '0 0 8 8', refX: 7, refY: 4, markerWidth: 5, markerHeight: 5, orient: 'auto-start-reverse'});
        marker.append(svgEl('path', {d: 'M 1 1 L 7 4 L 1 7', fill: 'none', stroke: 'var(--muted-foreground)', 'stroke-width': 1})); defs.append(marker); svg.append(defs);
        const wires = svgEl('g', {'aria-hidden': 'true'}); svg.append(wires);
        function pathFor(s, t, offset = 0) {
          if (s.rank === t.rank) {
            const toRight = s.x < t.x;
            const sx = toRight ? s.x + s.w : s.x, tx = toRight ? t.x : t.x + t.w;
            const sy = s.y + s.h / 2 + offset, ty = t.y + t.h / 2 + offset;
            if (toRight) return `M ${sx} ${sy} L ${tx} ${ty}`;
            const railY = s.y - 9 + offset;
            return `M ${sx + 8} ${s.y} V ${railY} H ${tx - 8} V ${t.y}`;
          }
          const sx = s.x + s.w / 2 + offset, tx = t.x + t.w / 2 + offset;
          const forward = t.rank > s.rank;
          const sy = forward ? s.y + s.h : s.y, ty = forward ? t.y : t.y + t.h;
          const crossesDetail = detailStart !== null && Math.min(sy, ty) < detailEnd && Math.max(sy, ty) > detailStart;
          if (Math.abs(s.rank - t.rank) === 1 && !crossesDetail) {
            const middle = (sy + ty) / 2 + offset;
            return `M ${sx} ${sy} V ${middle} H ${tx} V ${ty}`;
          }
          const rail = (tx < width / 2 ? 8 : width - 8) + offset;
          const d = forward ? 1 : -1;
          return `M ${sx} ${sy} V ${sy + d * 12} H ${rail} V ${ty - d * 12} H ${tx} V ${ty}`;
        }
        for (const edge of plot.section.edges) {
          const s = loc.get(edge.s), t = loc.get(edge.t), n = nodes[edge.via];
          if (!s || !t) continue;
          const count = members(n).length;
          const common = {fill: 'none', 'stroke-linejoin': 'round', 'stroke-linecap': 'round'};
          wires.append(svgEl('path', {...common, d: pathFor(s, t), stroke: 'var(--border)', 'stroke-width': 1.3, 'stroke-dasharray': edge.dashed ? '3 4' : 'none', 'marker-end': 'url(#arrow-' + plot.section.id + ')'}));
          if (aVal() === '' && bVal() === '' && count) wires.append(svgEl('path', {...common, d: pathFor(s, t), stroke: 'var(--foreground)', opacity: 0.28, 'stroke-width': 1 + count / 9}));
        }
        // Draw highlights after the entire neutral structure, so later unused
        // branches cannot obscure selected routes.
        for (const edge of plot.section.edges) {
          const s = loc.get(edge.s), t = loc.get(edge.t), n = nodes[edge.via];
          if (!s || !t) continue;
          for (const [mi, color, offset] of [[aVal(), colorA, -2], [bVal(), colorB, 2]]) {
            if (has(n, mi)) wires.append(svgEl('path', {d: pathFor(s, t, offset), fill: 'none', stroke: color, 'stroke-width': 2.4, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', 'stroke-dasharray': edge.dashed ? '3 4' : 'none'}));
          }
        }
        for (const [id, p] of loc) {
          const node = nodes[id], count = members(node).length;
          const activeA = has(node, aVal()), activeB = has(node, bVal());
          const link = svgEl('a', {href: '#choice-' + id, class: 'flow-node', 'aria-label': node.label + '. ' + count + ' models. ' + marks(node) + '. Show details.'});
          link.addEventListener('click', event => { event.preventDefault(); selectNode(id, plot.section.id); });
          const cut = node.kind === 'end' ? 9 : 4;
          const shape = `M ${p.x + cut} ${p.y} H ${p.x + p.w} V ${p.y + p.h - cut} L ${p.x + p.w - cut} ${p.y + p.h} H ${p.x} V ${p.y + cut} Z`;
          link.append(svgEl('path', {d: shape, class: 'node-shape', fill: 'var(--background)', stroke: id === selected ? 'var(--foreground)' : 'var(--border)', 'stroke-width': id === selected ? 2 : 1.2}));
          if (activeA || activeB) link.append(svgEl('path', {d: shape, fill: activeA ? colorA : colorB, opacity: 0.08}));
          if (activeA) link.append(svgEl('line', {x1: p.x + 6, x2: p.x + p.w - 6, y1: p.y + p.h - 5, y2: p.y + p.h - 5, stroke: colorA, 'stroke-width': 2}));
          if (activeB) link.append(svgEl('line', {x1: p.x + 6, x2: p.x + p.w - 6, y1: p.y + p.h - 9, y2: p.y + p.h - 9, stroke: colorB, 'stroke-width': 2}));
          let textY = p.y + 20;
          for (const [lines, cls, advance] of [[p.label, 'node-label', 16], [p.hint, 'node-hint', 15]]) {
            for (const line of lines) {
              const text = svgEl('text', {x: p.x + p.w / 2, y: textY, 'text-anchor': 'middle', class: cls});
              text.textContent = line; link.append(text); textY += advance;
            }
          }
          const c = svgEl('text', {x: p.x + p.w / 2, y: textY + 2, 'text-anchor': 'middle'});
          c.textContent = count + ' / ' + models.length + ' models'; link.append(c); textY += 21;
          for (const line of p.markLines) {
            const text = svgEl('text', {x: p.x + p.w / 2, y: textY, 'text-anchor': 'middle'});
            text.textContent = line; link.append(text); textY += 15;
          }
          svg.append(link);
        }
        const previous = plot.wrap.querySelector('svg');
        const focusedLink = previous && previous.contains(document.activeElement) ? document.activeElement.getAttribute('href') : null;
        if (previous) previous.replaceWith(svg); else plot.wrap.prepend(svg);
        if (focusedLink) {
          const nextFocus = Array.from(svg.querySelectorAll('a')).find(link => link.getAttribute('href') === focusedLink);
          if (nextFocus) nextFocus.focus({preventScroll: true});
        }
      }
      const observer = new ResizeObserver(schedule);
      for (const section of data.sections) {
        const disclosure = htmlEl('details', 'chapter-part'); disclosure.open = true;
        disclosure.append(htmlEl('summary', 'part-title', section.title));
        disclosure.append(htmlEl('div', 'part-subtitle text-small text-muted', section.subtitle));
        const wrap = htmlEl('div', 'flow-plot');
        const detail = htmlEl('div', 'flow-detail'); detail.hidden = true;
        wrap.append(detail); disclosure.append(wrap); $('parts').append(disclosure);
        plots.set(section.id, {section, disclosure, wrap, detail});
        disclosure.addEventListener('toggle', schedule);
        observer.observe(wrap); observer.observe(detail);
      }
      refreshLegend(); schedule();
    })();
  </script>
</div>
